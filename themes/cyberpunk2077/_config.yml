# Cyberpunk2077 Theme 配置

# 网站导航
menu:
  首页: /
  AI 学习: /ai-learning/
  项目实战: /projects/
  AI 面试: /interview/
  归档: /archives/
  关于: /about.html

# 社交链接
social:
  GitHub: https://github.com/dochaoing

category_descriptions:
  AI 学习路线: 从零基础开始，建立大模型原理、应用与部署的学习顺序
  AI 应用实战: 用 Python、API、RAG 和 Agent 完成可以运行与验收的项目

# 性能優化
performance:
  lazyload: true        # 圖片延遲加載
  minify: true          # 壓縮 HTML
  preload: true         # 預加載關鍵資源

# 代碼高亮
highlight:
  theme: github-light   # 或 github-dark
  line_number: true

# 文章設置
post:
  show_updated: true    # 顯示更新時間
  show_word_count: true # 顯示字數統計
  show_reading_time: true # 顯示閱讀時間

# 評論系統（可選）
comments:
  enable: false
