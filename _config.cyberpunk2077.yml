# Cyberpunk2077 Theme 配置
# 基于 NeuralFlow AI 博客定制

# ===========================================
# 🎯 导航菜单
# ===========================================
menu:
  首页: /
  文章: /archives
  关于: /about
  友链: /friends

# ===========================================
# 🔗 社交链接
# ===========================================
social:
  GitHub: https://github.com/DoChaoing
  Twitter: https://twitter.com
  Blog: https://dochaoing.github.io

# ===========================================
# ⚡ 性能优化
# ===========================================
performance:
  lazyload: true        # 图片延迟加载
  minify: true          # 压缩 HTML
  preload: true         # 预加载关键资源

# ===========================================
# 💻 代码高亮
# ===========================================
highlight:
  theme: tomorrow-night   # tomorrow-night | github-light | okaidia
  line_number: true
  show_language: true     # 显示语言标签
  copy_button: true       # 复制按钮

# ===========================================
# 📝 文章设置
# ===========================================
post:
  show_updated: true      # 显示更新时间
  show_word_count: true   # 显示字数统计
  show_reading_time: true # 显示阅读时间
  show_toc: true          # 显示目录
  toc_depth: 3            # 目录深度

# ===========================================
# 💬 评论系统
# ===========================================
comments:
  enable: true
  type: giscus
  giscus:
    repo: DoChaoing/dochaoing.github.io
    repoID: R_kgDOQkK0BA
    category: Announcements
    categoryID: DIC_kwDOQkK0BM4Czj3r
    mapping: pathname
    theme: dark
    lang: zh-CN
    loading: lazy

# ===========================================
# 🎭 动画效果
# ===========================================
animations:
  enable: true
  glitch: true            # 故障效果
  neon: true              # 霓虹效果
  scanlines: true         # 扫描线效果
  particles: true         # 粒子效果
  cursor_glow: true       # 鼠标光晕
  loading_animation: true # 加载动画

# ===========================================
# 🎨 自定义颜色 - 赛博朋克风格
# ===========================================
colors:
  # 主色调
  neon-cyan: "#00f0ff"      # 青色霓虹
  neon-pink: "#ff2a6d"      # 粉色霓虹
  neon-yellow: "#fcee0a"    # 黄色霓虹
  neon-purple: "#9d4edd"    # 紫色霓虹
  neon-green: "#7cff00"     # 绿色霓虹
  
  # 背景色
  background: "#0a0a0f"     # 深空黑
  background-alt: "#0d0221" # 暗紫黑
  card-bg: "rgba(13, 2, 33, 0.95)"
  
  # 文字色
  text-primary: "#e0e6ff"
  text-secondary: "#a0a0a0"
  text-muted: "#707070"

# ===========================================
# 🔤 字体设置
# ===========================================
fonts:
  # 标题字体
  title: "Orbitron"
  # 正文字体
  body: "LXGW WenKai TC"
  # 代码字体
  code: "JetBrains Mono"
  
# ===========================================
# 📊 首页统计
# ===========================================
stats:
  show_articles: true
  show_categories: true
  show_tags: true
  show_words: false

# ===========================================
# 🌐 SEO 设置
# ===========================================
seo:
  google_analytics: false
  baidu_analytics: false
  open_graph: true
  twitter_cards: true

# ===========================================
# 📱 页脚设置
# ===========================================
footer:
  since: 2025
  powered_by: true
  theme_info: true
  icp: ""    # ICP备案号
  police: "" # 公安备案号

# ===========================================
# 🎯 自定义脚本
# ===========================================
custom:
  head_inject: ""   # 注入到 head 的内容
  footer_inject: "" # 注入到 footer 的内容
