# --------------------------------------
# Hexo Butterfly Theme Configuration
# 科技风配置
# --------------------------------------

# --------------------------------------
# Navigation Settings
# --------------------------------------
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder
  关于: /about/ || fas fa-heart

# Social media links
social:
  fab fa-github: https://github.com/DoChaoing || Github || '#24292e'

# --------------------------------------
# Image Settings
# --------------------------------------
favicon: /img/favicon.png

avatar:
  img: /img/butterfly-icon.png
  effect: true

# --------------------------------------
# Theme Settings
# --------------------------------------
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4cc"
  button_hover: "#FF7242"
  text_selection: "#00c4cc"
  link_color: "#99a9bf"
  meta_color: "#858785"
  hr_color: "#d1d0d0"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4cc"
  readmode_bg_color: "#fafafa"

# 深色模式
dark_mode:
  enable: true
  button: true
  auto_change: true

# --------------------------------------
# Code Blocks Settings
# --------------------------------------
code_blocks:
  theme: darker
  macStyle: true
  height_limit: 400
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# --------------------------------------
# Website Background
# --------------------------------------
background: "linear-gradient(to right, #0f0c29, #302b63, #24243e)"

# --------------------------------------
# Cover Settings
# --------------------------------------
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both
  default_cover:
    - https://picsum.photos/seed/ai1/800/450
    - https://picsum.photos/seed/tech2/800/450
    - https://picsum.photos/seed/code3/800/450

# --------------------------------------
# Footer Settings
# --------------------------------------
footer:
  owner:
    enable: true
    since: 2025
  custom_text: <a href="https://github.com/DoChaoing">Chao Blog</a> | Exploring AI · Code · Future

# --------------------------------------
# Post Settings
# --------------------------------------
post:
  meta:
    author:
      enable: true
    date:
      enable: true
      format: "YYYY-MM-DD"
    wordcount:
      enable: true
    min2read:
      enable: true
  toc:
    enable: true
    number: true
    wrap: true
    expand_all: true

# --------------------------------------
# Aside Settings
# --------------------------------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  
  display:
    archive: true
    tag: true
    category: true

  card_author:
    enable: true
    description: AI Engineer | Full-Stack Developer
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/DoChaoing

  card_announcement:
    enable: false

  card_recent_post:
    enable: true
    limit: 5
    sort: date

  card_categories:
    enable: true
    limit: 8

  card_tags:
    enable: true
    limit: 40
    color: true

# --------------------------------------
# Font Settings
# --------------------------------------
font:
  global-font-size: 16px
  code-font-size: 16px
  font-family: "PingFang SC, Microsoft YaHei, sans-serif"
  code-font-family: "JetBrains Mono, Fira Code, monospace"

# --------------------------------------
# Highlight Theme
# --------------------------------------
highlight_theme: darker

# --------------------------------------
# Canvas Effects (科技风粒子效果)
# --------------------------------------
canvas_nest:
  enable: true
  color: '0, 156, 204'
  opacity: 0.7
  zIndex: -1
  count: 150

# --------------------------------------
# Pjax (SPA体验)
# --------------------------------------
pjax:
  enable: true

# --------------------------------------
# Lazyload
# --------------------------------------
lazyload:
  enable: true
  field: site
  placeholder: /img/loading.gif
  blur: true

# --------------------------------------
# PWA
# --------------------------------------
pwa:
  enable: false

# --------------------------------------
# Comments
# --------------------------------------
comments:
  use: false
  lazy: true
  count: true

# --------------------------------------
# Search
# --------------------------------------
algolia_search:
  enable: false

local_search:
  enable: true
  labels:
    input_placeholder: 搜索文章
    hits_empty: "未找到相关内容: ${query}"

# --------------------------------------
# Analytics
# --------------------------------------
busuanzi:
  site_uv: true
  site_pv: true
  post_pv: true

# --------------------------------------
# Inject
# --------------------------------------
inject:
  head:
    - <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  bottom:
