# Reimu theme override — keeps vendor theme files untouched.
theme_version_check: false
theme_config_check: true

menu:
  - name: home
    url: /
    icon: /images/nav/taiji.svg
  - name: archives
    url: /archives/
    icon: /images/nav/scroll.svg
  - name: categories
    url: /categories/
    icon: /images/nav/bagua.svg
  - name: tags
    url: /tags/
    icon: /images/nav/talisman.svg
  - name: AI 学习
    url: /ai-learning/
    icon: /images/nav/formation.svg
  - name: about
    url: /about.html
    icon: /images/nav/daoist.svg
  - name: friend
    url: /friends.html
    icon: /images/nav/lantern.svg

subtitle:
  typing:
    enable: true
    strings:
      - "以代码为符，向智能世界问道"
      - "AI · Code · Future"
      - "在山海与模型之间，构建下一段旅程"
    typeSpeed: 72
    backSpeed: 42
    backDelay: 2600
    startDelay: 450
    loop: true
    shuffle: true
    showCursor: true
    cursorChar: "|"

banner: /images/guochao-ai-hero.png
favicon: https://avatars.githubusercontent.com/u/16796652
# Reimu reads this file from source/_data/avatar/ and publishes it as /avatar/.
avatar: avatar-female-daoist.png
cover: /images/guochao-ai-hero.png
toc: true
toc_options:
  list_number: true
  min_depth: 1
  max_depth: 4

open_graph:
  enable: true
  options:
    default_og_image: /images/guochao-ai-hero.png

excerpt_link: 继续阅读
rss: atom.xml

footer:
  since: 2025
  powered: true
  count: true
  busuanzi: true

sidebar:
  position: right
  menu: true
  article:
    show_common: true

social:
  github: https://github.com/DoChaoing

widgets:
  - recent_posts
  - category
  - tagcloud

recent_posts_limits: 5
show_count: true
summary:
  enable: true
  style: subtitle

layout:
  max_width: 1380px

reimu_cursor:
  enable: true
  cursor:
    default: ../images/cursor/daoist-whisk.svg
    pointer: ../images/cursor/daoist-whisk-active.svg
    text: ../images/cursor/daoist-whisk-text.svg

font:
  enable: false

local_font:
  article:
    - 'Noto Serif SC'
    - 'Songti SC'
    - 'STSong'
    - 'PingFang SC'
    - serif
  code:
    - 'SFMono-Regular'
    - 'Cascadia Code'
    - Menlo
    - monospace

dark_mode:
  enable: true

generator_search:
  enable: true
  field: post
  content: true

tag_generator:
  enable_index_page: true

share:
  - weibo
  - qq
  - weixin

pace:
  enable: true

pjax:
  enable: false

pangu:
  enable: true

injector:
  head_end: |-
    <link rel="stylesheet" href="/css/guochao-reimu.css">
  body_begin: |-
    <div class="chao-aurora" aria-hidden="true"></div>
    <div class="chao-petals" aria-hidden="true"></div>
  body_end: |-
    <script defer src="/js/guochao-reimu.js"></script>
  sidebar_begin: |-
    <section class="chao-signal-card" aria-label="AI learning signal board">
      <div class="chao-signal-kicker">灵枢 · AI SIGNAL</div>
      <div class="chao-signal-title">修行进度</div>
      <div class="chao-signal-row"><span>Prompt</span><i style="--signal: 86%"></i><b>86</b></div>
      <div class="chao-signal-row"><span>RAG</span><i style="--signal: 78%"></i><b>78</b></div>
      <div class="chao-signal-row"><span>Agent</span><i style="--signal: 92%"></i><b>92</b></div>
    </section>
