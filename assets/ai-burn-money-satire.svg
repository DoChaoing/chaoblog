<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">烧钱的大模型与半成品变现的讽刺动图</title>
  <desc id="desc">三格漫画：算力账单烧钱、有人想到先推出半成品、客户付钱试用。</desc>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    .panel { stroke:#172333; stroke-width:7; rx:28; }
    .bob { animation:bob 1.8s ease-in-out infinite; transform-origin:center; }
    .flicker { animation:flicker .56s ease-in-out infinite alternate; transform-origin:center; }
    .idea { animation:idea 2.4s steps(1,end) infinite; }
    .roll { animation:roll 2.4s ease-in-out infinite; }
    .coin { opacity:0; animation:coin 2.4s ease-out infinite; }
    .coin.c2 { animation-delay:.24s; } .coin.c3 { animation-delay:.48s; }
    .spark { animation:spark .7s ease-in-out infinite alternate; }
    @keyframes bob { 50% { transform:translateY(-9px); } }
    @keyframes flicker { 50% { transform:scale(1.16) rotate(-4deg); opacity:.78; } }
    @keyframes idea { 0%,33% { opacity:0; transform:scale(.4); } 42%,100% { opacity:1; transform:scale(1); } }
    @keyframes roll { 0%,45% { transform:translateX(-13px); } 66%,100% { transform:translateX(24px); } }
    @keyframes coin { 0%,62% { opacity:0; transform:translate(0,16px) scale(.5); } 73% { opacity:1; } 100% { opacity:0; transform:translate(0,-76px) scale(1.1); } }
    @keyframes spark { to { transform:translateY(-8px) scale(1.25); opacity:.25; } }
  </style>
  <rect width="1200" height="720" fill="#fff4dc"/>
  <text x="600" y="68" text-anchor="middle" font-size="37" font-weight="800" fill="#172333">当大模型的账单烧起来了……</text>

  <g transform="translate(35 112)">
    <rect class="panel" width="350" height="555" fill="#f06b4e"/>
    <rect x="25" y="26" width="300" height="72" rx="16" fill="#fff4dc"/>
    <text x="175" y="75" text-anchor="middle" font-size="33" font-weight="800" fill="#c53a2f">算力账单</text>
    <g class="flicker" transform="translate(175 191)">
      <path d="M0 118 C-67 75-27 25-10 0 C-10 44 34 42 12 89 C42 66 51 97 39 118Z" fill="#ffd349" stroke="#172333" stroke-width="6"/>
      <path d="M6 109 C-24 78 4 49 15 31 C15 66 37 69 22 100Z" fill="#f36b35"/>
    </g>
    <g class="bob" transform="translate(64 326)">
      <circle cx="76" cy="70" r="48" fill="#ffd0b3" stroke="#172333" stroke-width="6"/>
      <path d="M35 58 Q78 4 119 54 L112 29 Q77 -3 37 26Z" fill="#22324a"/>
      <circle cx="58" cy="72" r="5" fill="#172333"/><circle cx="94" cy="72" r="5" fill="#172333"/>
      <path d="M56 98 Q76 84 97 101" fill="none" stroke="#172333" stroke-width="6" stroke-linecap="round"/>
      <path d="M28 139 Q77 107 127 139 L146 203 H7Z" fill="#56b5b0" stroke="#172333" stroke-width="6"/>
    </g>
    <g transform="translate(222 356)">
      <rect width="91" height="108" rx="9" fill="#fffbef" stroke="#172333" stroke-width="6"/>
      <path d="M16 28H76M16 48H65M16 68H76" stroke="#f06b4e" stroke-width="6"/>
      <text x="45" y="95" text-anchor="middle" font-size="26" font-weight="800" fill="#172333">¥¥¥</text>
    </g>
    <text x="175" y="528" text-anchor="middle" font-size="28" font-weight="800" fill="#fff4dc">“这怎么越训越贵？！”</text>
  </g>

  <g transform="translate(425 112)">
    <rect class="panel" width="350" height="555" fill="#3c88a1"/>
    <text x="175" y="62" text-anchor="middle" font-size="30" font-weight="800" fill="#fff4dc">有人举手：</text>
    <g class="idea" transform="translate(175 128)">
      <path d="M0 0 m-47 0 a47 47 0 1 0 94 0 a47 47 0 1 0 -94 0" fill="#ffdb4c" stroke="#172333" stroke-width="7"/>
      <path d="M-18 48H18M-13 63H13" stroke="#172333" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 -72V-98M-64 -42L-84 -60M64 -42L84 -60M-78 11H-105M78 11H105" stroke="#ffdb4c" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g class="bob" transform="translate(95 290)">
      <circle cx="80" cy="70" r="50" fill="#d9a57d" stroke="#172333" stroke-width="6"/>
      <path d="M30 58 Q77 5 130 52 L122 22 Q73 -2 35 22Z" fill="#5b345b"/>
      <circle cx="61" cy="72" r="5" fill="#172333"/><circle cx="98" cy="72" r="5" fill="#172333"/>
      <path d="M58 98 Q80 116 103 94" fill="none" stroke="#172333" stroke-width="6" stroke-linecap="round"/>
      <path d="M25 140 Q78 112 134 140 L157 211 H3Z" fill="#ffcf50" stroke="#172333" stroke-width="6"/>
      <path d="M132 158 Q200 117 207 51" fill="none" stroke="#172333" stroke-width="14" stroke-linecap="round"/>
      <path d="M205 58 L192 39 M205 58 L223 42" stroke="#172333" stroke-width="7" stroke-linecap="round"/>
    </g>
    <path d="M40 481 Q175 442 310 481 L294 535 Q176 504 56 535Z" fill="#fff4dc" stroke="#172333" stroke-width="6"/>
    <text x="175" y="491" text-anchor="middle" font-size="27" font-weight="800" fill="#172333">“先推出去让大家用？”</text>
    <text x="175" y="524" text-anchor="middle" font-size="27" font-weight="800" fill="#172333">“半成品也能先收点钱！”</text>
  </g>

  <g transform="translate(815 112)">
    <rect class="panel" width="350" height="555" fill="#f6c84d"/>
    <text x="175" y="62" text-anchor="middle" font-size="31" font-weight="800" fill="#172333">商业模式启动！</text>
    <g class="roll" transform="translate(36 170)">
      <rect x="35" y="50" width="185" height="140" rx="19" fill="#fff4dc" stroke="#172333" stroke-width="7"/>
      <rect x="54" y="70" width="147" height="58" rx="11" fill="#56b5b0"/>
      <text x="128" y="108" text-anchor="middle" font-size="28" font-weight="900" fill="#172333">半成品 AI</text>
      <path d="M68 151H190" stroke="#f06b4e" stroke-width="11" stroke-linecap="round"/>
      <circle cx="67" cy="206" r="20" fill="#172333"/><circle cx="194" cy="206" r="20" fill="#172333"/>
      <path d="M0 111H34" stroke="#172333" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g transform="translate(236 300)">
      <circle cx="44" cy="42" r="40" fill="#ffd0b3" stroke="#172333" stroke-width="6"/>
      <path d="M18 38 Q44 5 72 34" stroke="#172333" stroke-width="15" fill="none"/>
      <circle cx="30" cy="43" r="4"/><circle cx="58" cy="43" r="4"/>
      <path d="M27 62 Q44 78 61 61" fill="none" stroke="#172333" stroke-width="5"/>
      <path d="M9 91Q44 75 79 91L91 157H-3Z" fill="#ef6d57" stroke="#172333" stroke-width="6"/>
      <path d="M10 111 L-39 92" stroke="#172333" stroke-width="10" stroke-linecap="round"/>
      <rect x="-88" y="55" width="56" height="49" rx="8" fill="#172333"/>
      <text x="-60" y="88" text-anchor="middle" font-size="28" font-weight="900" fill="#ffd349">¥</text>
    </g>
    <g class="coin" transform="translate(146 381)"><circle r="20" fill="#ff8c3a" stroke="#172333" stroke-width="5"/><text y="9" text-anchor="middle" font-size="26" font-weight="900">¥</text></g>
    <g class="coin c2" transform="translate(185 396)"><circle r="20" fill="#ff8c3a" stroke="#172333" stroke-width="5"/><text y="9" text-anchor="middle" font-size="26" font-weight="900">¥</text></g>
    <g class="coin c3" transform="translate(220 378)"><circle r="20" fill="#ff8c3a" stroke="#172333" stroke-width="5"/><text y="9" text-anchor="middle" font-size="26" font-weight="900">¥</text></g>
    <rect x="35" y="491" width="280" height="48" rx="20" fill="#172333"/>
    <text x="175" y="524" text-anchor="middle" font-size="26" font-weight="800" fill="#fff4dc">先让大家试用，收点钱！</text>
  </g>
  <text x="600" y="705" text-anchor="middle" font-size="18" fill="#6b6153">虚构恶搞 · 不代表任何公司的真实经营情况</text>
</svg>
